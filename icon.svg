<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#361e57" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#361e57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4f0031" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4f0031" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconGlow" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#ee343b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ee343b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4f501"/>
      <stop offset="100%" stop-color="#88d600"/>
    </linearGradient>
    <linearGradient id="magA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff614d"/>
      <stop offset="100%" stop-color="#ee343b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#080512"/>
  <rect width="512" height="512" fill="url(#glow1)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>
  <circle cx="256" cy="256" r="230" fill="url(#iconGlow)"/>

  <!-- mehr Innenabstand: knappere Masken/Glass-Rundung verzeihen weniger Rand -->
  <g transform="translate(256,256) scale(0.85) translate(-256,-256)">
    <!-- Kreuz -->
    <path d="M194,106 H318 V194 H406 V318 H318 V406 H194 V318 H106 V194 H194 Z"
          fill="url(#magA)" stroke="#04020b" stroke-width="26" stroke-linejoin="round"
          transform="rotate(-5 256 256)"/>
    <!-- Blitz -->
    <path d="M338,64 L188,296 L246,296 L206,448 L366,232 L296,232 Z"
          fill="url(#limeA)" stroke="#04020b" stroke-width="22" stroke-linejoin="round"
          transform="rotate(3 256 256)"/>
  </g>
</svg>
